[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "trustsql"
version = "0.1.0"
description = "Metadata-grounded SQL with constrained execution and reproducible reliability evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.51",
  "psycopg[binary]>=3.2,<4",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlglot>=28,<31",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.21", "playwright==1.63.0"]
datahub = ["acryl-datahub>=1.3,<2"]

[project.scripts]
trustsql = "trustsql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustsql = ["assets/*", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs TRUSTSQL_TEST_POSTGRES_URL and a disposable PostgreSQL database"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

